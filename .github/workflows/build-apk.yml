name: Build TelePro APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Free disk space
      run: |
        echo "Disk before cleanup:"
        df -h
        sudo rm -rf /usr/local/lib/android/sdk/emulator
        sudo rm -rf /usr/local/lib/android/sdk/system-images
        sudo rm -rf /usr/local/lib/android/sdk/platforms/android-30
        sudo rm -rf /usr/local/lib/android/sdk/platforms/android-31
        sudo rm -rf /usr/local/lib/android/sdk/platforms/android-32
        sudo rm -rf /usr/local/lib/android/sdk/platforms/android-33
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /opt/hostedtoolcache/Ruby
        sudo rm -rf /opt/hostedtoolcache/go
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        echo "Disk after cleanup:"
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: gradle

    - name: Set up NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r21e
        add-to-path: false

    - name: Patch app name to TelePro
      run: |
        sed -i "s|<string name="AppName">Telegram</string>|<string name="AppName">TelePro</string>|g" TMessagesProj/src/main/res/values/strings.xml
        grep -n "AppName" TMessagesProj/src/main/res/values/strings.xml | head -3

    - name: Patch gradle.properties (package, keystore params)
      run: |
        sed -i "s/APP_PACKAGE=org\.telegram\.messenger/APP_PACKAGE=org.telepro.messenger/" gradle.properties
        grep APP_PACKAGE gradle.properties
        grep RELEASE_ gradle.properties

    - name: Patch google-services.json for org.telepro.messenger
      run: |
        sed -i "s/"package_name": "org.telegram.messenger"/"package_name": "org.telepro.messenger"/g" TMessagesProj_App/google-services.json
        grep package_name TMessagesProj_App/google-services.json

    - name: Limit ABI to arm64-v8a and armeabi-v7a only
      run: |
        sed -i "s/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "armeabi-v7a", "arm64-v8a"/g" TMessagesProj_App/build.gradle
        grep -A3 "afat {" TMessagesProj_App/build.gradle | head -10

    - name: Install TelePro icons from CDN
      run: |
        pip install Pillow --quiet
        python3 scripts/install_icons.py

    - name: Create VlessProxy.java
      run: |
        mkdir -p TMessagesProj/src/main/java/org/telegram/messenger/
        printf "%s\n" "package org.telegram.messenger;" "" "/** VLESS+Reality proxy - hardcoded */" "public final class VlessProxy {" "    public static final String SERVER = \"89.125.81.82\";" "    public static final int PORT = 40103;" "    public static final String UUID = \"0ce42a0d-dc2f-451b-b9cf-873cafa1c8bc\";" "    public static final String PUBLIC_KEY = \"OT_WzoLLJtw_JXfvZQdyFsy--3EoIeU8TRYYUmmpjzU\";" "    public static final String SHORT_ID = \"a66e64df80c7c69c\";" "    public static final String SNI = \"www.amd.com\";" "    public static final String FLOW = \"xtls-rprx-vision\";" "    public static final String FINGERPRINT = \"chrome\";" "    public static final String SECURITY = \"reality\";" "    public static final String NETWORK = \"tcp\";" "    private VlessProxy() {}" "}" > TMessagesProj/src/main/java/org/telegram/messenger/VlessProxy.java
        echo "VlessProxy.java created"

    - name: Patch ApplicationLoader.java to enable VLESS proxy on start
      run: python3 scripts/patch_proxy.py

    - name: Regenerate keystore with alias androidkey
      run: |
        rm -f TMessagesProj/config/release.keystore
        mkdir -p TMessagesProj/config
        keytool -genkeypair -v \
          -keystore TMessagesProj/config/release.keystore \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=TelePro,OU=Dev,O=TelePro,L=Moscow,ST=Moscow,C=RU"
        echo "Keystore regenerated with alias=androidkey storepass=android"

    - name: Write local.properties sdk.dir
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: TelePro-APK
        path: TMessagesProj_App/build/outputs/apk/**/*.apk
        retention-days: 30

    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          TMessagesProj_App/build/outputs/logs/
          TMessagesProj/build/outputs/logs/
        retention-days: 7
